<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="emblemGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="emblemNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152E54" />
      <stop offset="100%" stop-color="#071324" />
    </linearGradient>
    <filter id="emblemDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#emblemNavy)" stroke="url(#emblemGold)" stroke-width="2.5" filter="url(#emblemDrop)" />
  <circle cx="50" cy="50" r="41" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>

  <!-- Artisan Dokra Motif / Sun Rays -->
  <g transform="rotate(0 50 50)">
    <path d="M50 14 L52 22 L48 22 Z" fill="url(#emblemGold)" />
    <path d="M50 86 L52 78 L48 78 Z" fill="url(#emblemGold)" />
    <path d="M14 50 L22 52 L22 48 Z" fill="url(#emblemGold)" />
    <path d="M86 50 L78 52 L78 48 Z" fill="url(#emblemGold)" />
    <path d="M24 24 L31 30 L28 33 Z" fill="url(#emblemGold)" />
    <path d="M76 76 L69 70 L72 67 Z" fill="url(#emblemGold)" />
    <path d="M24 76 L30 69 L33 72 Z" fill="url(#emblemGold)" />
    <path d="M76 24 L70 31 L67 28 Z" fill="url(#emblemGold)" />
  </g>

  <!-- Clay Pradip / Diya Lamp -->
  <path d="M32 55 Q50 67 68 55 Q62 65 50 67 Q38 65 32 55 Z" fill="url(#emblemGold)" />
  <ellipse cx="50" cy="53" rx="18" ry="5" fill="#78350F" />
  <ellipse cx="50" cy="52" rx="15" ry="3" fill="#F59E0B" opacity="0.8" />
  <!-- Flame -->
  <path d="M50 30 C56 38 57 46 50 51 C43 46 44 38 50 30 Z" fill="url(#emblemGold)" />
  <circle cx="50" cy="45" r="3" fill="#FFFFFF" opacity="0.9" />

  <!-- Initials JP MPC -->
  <text x="50" y="81" font-family="'Cinzel', 'Times New Roman', serif" font-weight="900" font-size="10" fill="url(#emblemGold)" text-anchor="middle" letter-spacing="1.5">JIT PRIME</text>
</svg>
