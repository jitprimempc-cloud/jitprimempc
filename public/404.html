<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Jit Prime MPC Company</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages redirect trick
      var path = window.location.pathname;
      var repo = '/clintdemos';
      if (path.indexOf(repo) === 0) {
        var subRoute = path.substring(repo.length);
        if (subRoute && subRoute !== '/') {
          window.location.replace(window.location.origin + repo + '/#' + subRoute + window.location.search);
        } else {
          window.location.replace(window.location.origin + repo + '/');
        }
      }
    </script>
  </head>
  <body>
  </body>
</html>
